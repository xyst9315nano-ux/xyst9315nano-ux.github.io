<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和泉 響｜古物の買取・販売</title>
<meta name="description" content="トレーディングカード、おもちゃ・ホビー、ブランド品、スマートフォン・電子機器、時計の買取・販売（秋田県横手市）">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --text: #1f2328; --muted: #5b636b;
    --line: #dedbd2; --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181a; --card: #1e2124; --text: #e8e6e1; --muted: #a3a9ae; --line: #33373b; --accent: #7fb8a6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; line-height: 1.8; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .04em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .notice { margin: 28px 0; padding: 14px 18px; border-left: 4px solid var(--accent);
    background: var(--card); border-radius: 4px; }
  section { margin-top: 36px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  ul.items { list-style: none; padding: 0; margin: 0; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  ul.items li { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; vertical-align: top; padding: 10px 14px; border: 1px solid var(--line); }
  th { width: 34%; font-weight: 600; color: var(--muted); }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>和泉 響</h1>
    <p>古物の買取・販売（秋田県横手市）</p>
  </header>

  <div class="notice">
    現在、古物商許可を申請中です。許可を受けたあと、許可番号をこのページに掲載し、買取・販売を始めます。
  </div>

  <section>
    <h2>取扱品目</h2>
    <ul class="items">
      <li>トレーディングカード</li>
      <li>おもちゃ・ホビー用品</li>
      <li>ブランド品（衣類・バッグ・財布など）</li>
      <li>時計・アクセサリー</li>
      <li>スマートフォン・タブレット</li>
      <li>パソコン・カメラなどの電子機器</li>
    </ul>
  </section>

  <section>
    <h2>古物営業法に基づく表示</h2>
    <table>
      <tr><th>氏名</th><td>和泉 響</td></tr>
      <tr><th>許可をした公安委員会</th><td>秋田県公安委員会</td></tr>
      <tr><th>許可番号</th><td>申請中（許可後に掲載します）</td></tr>
    </table>
  </section>

  <footer>&copy; 和泉 響</footer>
</div>
</body>
</html>
